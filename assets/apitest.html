<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Fandom</title>
</head>

<body>
    <header>
        <h1>Star Wars: Legends Fandom</h1>
    </header>

    <main class="leftright-main">

        <div style="width:300px; height:300px;" class="card card-padded">

            <div>
                <p id="character-name">Fetching name...</p>
            </div>

        </div>

    </main>


    <script>

        const characterName = document.getElementById('character-name');

        async function getData(){
            try{
                const response = await fetch('https://www.swapi.tech/api/people/1');

                if(!response.ok){
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const data = await response.json();
                const name = data.result.properties.name;
                
                characterName.textContent = name;

            }catch(error){
                console.error(error);
            }
        };

        getData();

    </script>
</body>

</html>
